        <!-- Col 3: Bratislava address -->
        <div class="footer-col">

                <li>

<!-- Modal: Kontakt -->
<template if:true={isModalOpen}>
  <div class="hdr-modal-overlay">
    <div class="hdr-modal-box" role="dialog" aria-modal="true" aria-labelledby="footer-contact-title">
      <div class="hdr-modal-head">
        <h2 id="footer-contact-title">Kontaktuj nás</h2>
        <button class="hdr-modal-close" title="Zavrieť" autofocus onclick={closeModal}>✕</button>
      </div>
      <div class="hdr-modal-body">
        <lightning-flow
          flow-api-name="SFSCH_Contact_Us"
          onstatuschange={handleStatusChange}>
        </lightning-flow>
      </div>
    </div>
  </div>
  <div class="hdr-modal-backdrop" aria-hidden="true" onclick={closeModal}></div>
</template>

<!-- Modal: Mám záujem -->
<template if:true={isModalOpen2}>
  <div class="hdr-modal-overlay">
    <div class="hdr-modal-box" role="dialog" aria-modal="true" aria-labelledby="footer-interest-title">
      <div class="hdr-modal-head">
        <h2 id="footer-interest-title">Mám záujem</h2>
        <button class="hdr-modal-close" title="Zavrieť" autofocus onclick={closeModal2}>✕</button>
      </div>
      <div class="hdr-modal-body">
        <lightning-flow
          flow-api-name="Interest_Flow_Zaujem"
          onstatuschange={handleStatusChange2}>
        </lightning-flow>
      </div>
    </div>
  </div>
  <div class="hdr-modal-backdrop" aria-hidden="true" onclick={closeModal2}></div>
</template>
